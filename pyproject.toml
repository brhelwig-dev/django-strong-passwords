[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "django-strong-passwords"
version = "0.1.4"
description = "A Django reusable app that provides validators and a form field that checks the strength of a password"
readme = "README.rst"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Brandon Helwig", email = "django-strong-passwords@brandonhelwig.com" }
]
requires-python = ">=3.10"
dependencies = [
    "Django>=3.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Framework :: Django",
]

[project.urls]
Homepage = "https://github.com/brhelwig/django-strong-passwords/"

[tool.uv.build-backend]
module-name = "passwords"
module-root = ""

[dependency-groups]
dev = [
    "coverage",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
